<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Good Day coffee drink</title>
  <desc id="desc">Original illustration of a coffee sachet and iced coffee glass.</desc>
